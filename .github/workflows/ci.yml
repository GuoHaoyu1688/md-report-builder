name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-cjk
      - run: python -m pip install -e '.[dev,pdf]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --cov=md_report_builder
      - run: mdr lint examples/report.md --json
      - run: mdr build examples/report.md --to docx --out data/smoke --json
      - run: mdr build examples/report.md --to pdf --out data/smoke --json
