[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-report-builder"
version = "0.1.0"
description = "Offline Markdown reports with DOCX, PDF, HTML, templates and MCP"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["markdown-it-py>=3,<5", "mdit-py-plugins>=0.4,<1", "python-docx>=1.1,<2", "PyYAML>=6,<7", "matplotlib>=3.9,<4", "Pillow>=10", "mcp>=1.20,<2"]

[project.optional-dependencies]
pdf = ["weasyprint>=70,<71"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11", "pypdf>=5", "pypdfium2>=4.30", "beautifulsoup4>=4"]

[project.scripts]
mdr = "md_report_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md_report_builder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/md_report_builder/core/html_output.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
